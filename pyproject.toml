[project]
name = "solarops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devlprkhan", email = "devlpr.khan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "universal-data-cleaner>=2.11.0",
]

[project.scripts]
solarops = "solarops:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
